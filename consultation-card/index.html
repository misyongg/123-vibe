<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #fff8e1 0%, #fce4ec 50%, #e8eaf6 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #5d5d6d;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #7b6f8e;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.95);
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      color: #7b6f8e;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      color: #9e9eb0;
      text-align: center;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html">← 홈으로</a>
  <h1>📋 상담 카드</h1>
  <p>곧 만들 예정입니다.</p>
</body>
</html>
