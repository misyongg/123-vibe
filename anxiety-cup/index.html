<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫙 불안 종이컵</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eef1ff;
  --accent: #6c7ef0;
  --accent2: #a78bfa;
  --paper: #fffbe6;
  --text: #2d3560;
  --muted: #8b96c8;
  --cup-body: #c9d6ff;
  --cup-rim: #a0b4f8;
  --shadow: rgba(108,126,240,0.13);
  --card: #fff;
  --green: #38a169;
}
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 80px;
  color: var(--text);
}

.top-bar {
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin-bottom: 16px;
  gap: 8px;
}
.nav-link {
  color: var(--text);
  text-decoration: none;
  font-size: 0.84rem;
  font-weight: 600;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 12px;
  box-shadow: 0 2px 8px var(--shadow);
  white-space: nowrap;
}
.nav-link:active { transform: scale(0.96); }
.nav-link.teacher {
  color: var(--accent);
  border: 1.5px solid #c7d2fe;
}

.app-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.app-sub {
  font-size: 0.87rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.7;
  margin-bottom: 30px;
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 28px 22px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 6px 30px var(--shadow);
  margin-bottom: 18px;
}
.section-label {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
input[type="text"], textarea {
  width: 100%;
  border: 1.5px solid #dde3ff;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.93rem;
  font-family: inherit;
  color: var(--text);
  background: #f7f8ff;
  outline: none;
  resize: none;
  transition: border 0.2s, background 0.2s;
}
input[type="text"]:focus, textarea:focus {
  border-color: var(--accent);
  background: #fff;
}
.field-block { margin-bottom: 16px; }
.field-block label {
  display: block;
  font-size: 0.86rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}
.field-hint {
  font-size: 0.76rem;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.5;
}

.cup-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 4px;
  position: relative;
}
.cup-wrap {
  position: relative;
  width: 220px;
  height: 260px;
}
.cup-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 2;
}
.cup-note-count {
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 10px;
  text-align: center;
}
.notes-in-cup {
  position: absolute;
  top: 44px;
  left: 54px;
  width: 112px;
  height: 172px;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}
.mini-note {
  position: absolute;
  width: 56px;
  height: 44px;
  background: center/contain no-repeat url("paper.png");
  filter: drop-shadow(0 2px 3px rgba(90, 70, 20, 0.22));
}

@keyframes foldAndDrop {
  0%   { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
  30%  { transform: scale(0.8) rotate(-10deg) translateY(-20px); opacity: 0.95; }
  60%  { transform: scale(0.45) rotate(6deg) translateY(60px); opacity: 0.7; }
  85%  { transform: scale(0.2) rotate(-3deg) translateY(160px); opacity: 0.4; }
  100% { transform: scale(0.05) rotate(0deg) translateY(260px); opacity: 0; }
}
.fly-note {
  position: fixed;
  z-index: 9999;
  background: linear-gradient(135deg, #fff9e6, #ffeebb);
  border: 2px solid #f0c040;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 0.9rem;
  color: #b07800;
  width: 165px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(100, 150, 200, 0.25);
  pointer-events: none;
  animation: foldAndDrop 1.0s cubic-bezier(0.4,0,0.2,1) forwards;
}

.btn-main {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.01em;
  box-shadow: 0 5px 18px rgba(108,126,240,0.28);
  transition: background 0.2s, transform 0.1s;
}
.btn-main:hover { background: #5568e0; }
.btn-main:active { transform: scale(0.98); }
.btn-main:disabled { background: #c5cbe9; cursor: not-allowed; box-shadow: none; }

.btn-outline {
  padding: 12px 26px;
  border: 2px solid var(--accent);
  border-radius: 12px;
  background: transparent;
  color: var(--accent);
  font-size: 0.93rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 16px;
}
.btn-outline:hover { background: var(--accent); color: #fff; }

.status-msg {
  font-size: 0.86rem;
  text-align: center;
  margin-top: 11px;
  min-height: 20px;
  color: var(--muted);
}
.status-msg.err { color: #e74c3c; }
.status-msg.ok  { color: #27ae60; }

.done-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.done-screen.on { display: flex; }
.done-icon { font-size: 3.2rem; margin-bottom: 14px; animation: bounce 0.6s ease; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  40%      { transform: translateY(-12px); }
}
.done-title { font-size: 1.18rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
.done-desc  { font-size: 0.88rem; color: var(--muted); line-height: 1.8; }

.divider { border: none; border-top: 1.5px solid #eef0ff; margin: 18px 0; }

.nickname-badge {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.nickname-badge.on { display: flex; }
.nickname-badge .chip {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--accent);
  background: #f0f3ff;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1.5px solid #c7d2fe;
}
.nickname-badge button {
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 4px;
}
.nickname-saved-hint {
  font-size: 0.72rem;
  color: var(--green);
  margin-top: 4px;
  display: none;
}
.nickname-saved-hint.on { display: block; }
.app-credit {
  margin-top: 24px;
  padding-bottom: 8px;
  font-size: 0.72rem;
  color: var(--muted);
  text-align: center;
  opacity: 0.85;
}
</style>
</head>
<body>

<nav class="top-bar">
  <a class="nav-link teacher" href="불안의파도타기.html">🌊 선생님용</a>
</nav>

<div class="app-title">🫙 불안 종이컵</div>
<p class="app-sub">
  불안한 마음을 쪽지에 적어 컵에 넣어보세요.<br>
  한 번 넣은 쪽지는 꺼낼 수 없어요. 그래도 괜찮아요.
</p>
<p class="app-credit">제작 · misyongg</p>

<div class="card" id="nicknameCard">
  <div class="section-label">나의 별칭</div>
  <input type="text" id="nickname" placeholder="예) 파란구름, 햇살이, 초록별…" maxlength="20" autocomplete="off">
  <div class="nickname-saved-hint" id="nicknameSavedHint">✓ 별칭이 이 기기에 저장됐어요</div>
  <div class="nickname-badge" id="nicknameBadge">
    <span class="chip" id="nicknameChip"></span>
    <button type="button" id="nicknameEdit">별칭 수정</button>
  </div>
  <div class="field-hint">별칭은 상담 선생님과 쪽지를 함께 볼 때 사용돼요. 입력하면 자동으로 기억해요.</div>
</div>

<div class="card" id="mainCard">
  <div class="cup-area">
    <div class="cup-wrap" id="cupWrap">
      <img class="cup-image" src="emptycup.png" alt="종이컵">
      <div class="notes-in-cup" id="notesStack"></div>
    </div>
    <div class="cup-note-count" id="noteCountLabel">아직 쪽지가 없어요</div>
  </div>

  <hr class="divider">

  <div class="field-block">
    <label>💜 지금 어떤 감정이 드나요?</label>
    <textarea id="fEmotion" rows="2"
      placeholder="예) 무서워, 조마조마해, 답답하고 울고 싶어…"></textarea>
    <div class="field-hint">불안 외에 함께 느껴지는 감정도 써도 좋아요.</div>
  </div>

  <div class="field-block">
    <label>💭 머릿속에 어떤 생각이 맴도나요?</label>
    <textarea id="fThought" rows="2"
      placeholder="예) '또 실수할 것 같아', '나만 이상한가봐', '어떡하지…'"></textarea>
  </div>

  <div class="field-block">
    <label>📍 어떤 상황이었나요?</label>
    <textarea id="fSituation" rows="2"
      placeholder="예) 발표가 있기 전날 밤, 친구랑 다툰 직후…"></textarea>
  </div>

  <button class="btn-main" id="btnSubmit" onclick="handleSubmit()">
    📝 쪽지 접어서 종이컵에 넣기
  </button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="card" id="doneCard" style="display:none;">
  <div class="done-screen on">
    <div class="done-icon">🫙✨</div>
    <div class="done-title">쪽지가 컵 속에 들어갔어요</div>
    <div class="done-desc">
      지금 느끼는 불안을 컵에 담아줬어요.<br>
      선생님과 함께 쪽지를 꺼내볼 거예요.<br><br>
      지금은 잠깐 숨을 한 번 고르고 가요 🌿
    </div>
    <button class="btn-outline" onclick="writeAgain()">+ 쪽지 하나 더 넣기</button>
  </div>
</div>

<script>
const ANXIETY_CUP_CONFIG = {
  GOOGLE_SHEETS_URL: "https://script.google.com/macros/s/AKfycbzZpQNu-ec11y6yaDEuKaU_hOFR0K7y62AO_sdykqfpevAzOMHS4YAtz3cjS7e6pZHFxQ/exec",
  TEACHER_PASSWORD: "10042580"
};
</script>
<script>
const SCRIPT_URL = (typeof ANXIETY_CUP_CONFIG !== "undefined" && ANXIETY_CUP_CONFIG.GOOGLE_SHEETS_URL) || "";
const NICKNAME_KEY = "anxietyCupNickname";
const COUNT_KEY = "anxietyCupCount";
const RECORDS_KEY = "anxietyCupRecords";

let noteCount = parseInt(localStorage.getItem(COUNT_KEY) || "0", 10);
let nicknameSaveTimer = null;

function getNickname() {
  try { return localStorage.getItem(NICKNAME_KEY) || ""; }
  catch (e) { return ""; }
}

function saveNickname(name) {
  const trimmed = String(name || "").trim();
  if (!trimmed) return false;
  try { localStorage.setItem(NICKNAME_KEY, trimmed); }
  catch (e) { return false; }
  updateNicknameUI(trimmed);
  return true;
}

function updateNicknameUI(nick) {
  const badge = document.getElementById("nicknameBadge");
  const hint = document.getElementById("nicknameSavedHint");
  const input = document.getElementById("nickname");
  if (nick) {
    document.getElementById("nicknameChip").textContent = "👋 " + nick;
    badge.classList.add("on");
    hint.classList.add("on");
    input.value = nick;
  } else {
    badge.classList.remove("on");
    hint.classList.remove("on");
  }
}

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; }
  catch (e) { return []; }
}

function saveRecordLocal(record) {
  const list = loadRecords();
  list.push(record);
  localStorage.setItem(RECORDS_KEY, JSON.stringify(list));
}

function syncNoteCountFromRecords() {
  const records = loadRecords();
  if (!records.length) return;
  const nick = getNickname();
  noteCount = nick
    ? records.filter(r => r.nickname === nick).length
    : Math.max(noteCount, records.length);
  localStorage.setItem(COUNT_KEY, String(noteCount));
}

async function syncNoteCountFromServer() {
  const nick = getNickname();
  if (!nick || !SCRIPT_URL) return false;
  try {
    const res = await fetch(
      SCRIPT_URL + "?action=get&nickname=" + encodeURIComponent(nick)
    );
    const json = await res.json();
    if (json.ok && Array.isArray(json.notes)) {
      noteCount = json.notes.length;
      localStorage.setItem(COUNT_KEY, String(noteCount));
      renderCup();
      return true;
    }
  } catch (e) {
    /* keep local count if server sync fails */
  }
  return false;
}

function scheduleNicknameSave() {
  clearTimeout(nicknameSaveTimer);
  nicknameSaveTimer = setTimeout(() => {
    const val = document.getElementById("nickname").value.trim();
    if (val) saveNickname(val);
  }, 400);
}

(async function init() {
  updateNicknameUI(getNickname());

  const synced = await syncNoteCountFromServer();
  if (!synced) {
    syncNoteCountFromRecords();
    renderCup();
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") syncNoteCountFromServer();
  });
  window.addEventListener("focus", function () { syncNoteCountFromServer(); });

  const nickInput = document.getElementById("nickname");
  nickInput.addEventListener("input", scheduleNicknameSave);
  nickInput.addEventListener("blur", () => {
    const val = nickInput.value.trim();
    if (val) {
      saveNickname(val);
      syncNoteCountFromServer();
    }
  });
  document.getElementById("nicknameEdit").addEventListener("click", () => {
    nickInput.focus();
    nickInput.select();
  });
})();

async function handleSubmit() {
  const nickname  = document.getElementById("nickname").value.trim();
  const emotion   = document.getElementById("fEmotion").value.trim();
  const thought   = document.getElementById("fThought").value.trim();
  const situation = document.getElementById("fSituation").value.trim();

  if (!nickname) { setMsg("별칭을 먼저 입력해 주세요 🙂", "err"); return; }
  if (!emotion && !thought && !situation) {
    setMsg("감정, 생각, 상황 중 하나 이상 적어주세요.", "err"); return;
  }

  saveNickname(nickname);

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  btn.textContent = "쪽지 접는 중…";
  setMsg("", "");

  await animateFly();

  const payload = {
    recordType: "note",
    timestamp: new Date().toLocaleString("ko-KR"),
    nickname, emotion, thought, situation
  };

  saveRecordLocal(payload);

  let syncMsg = "";
  if (SCRIPT_URL) {
    try {
      await postToSheet(payload);
      syncMsg = "ok";
    } catch (e) {
      console.warn("전송 오류:", e);
      syncMsg = "err";
    }
  } else {
    syncMsg = "local";
  }

  noteCount++;
  localStorage.setItem(COUNT_KEY, String(noteCount));
  renderCup();

  document.getElementById("mainCard").style.display = "none";
  document.getElementById("nicknameCard").style.display = "none";
  document.getElementById("doneCard").style.display = "block";

  const doneDesc = document.querySelector(".done-desc");
  if (syncMsg === "local") {
    doneDesc.innerHTML =
      "지금 느끼는 불안을 컵에 담아줬어요.<br>" +
      "이 기기에 쪽지가 저장됐어요 📱<br>" +
      "<small style='color:var(--muted)'>선생님 시트 연동은 아직 설정 전이에요.</small><br><br>" +
      "지금은 잠깐 숨을 한 번 고르고 가요 🌿";
  } else if (syncMsg === "err") {
    doneDesc.innerHTML =
      "쪽지는 이 기기에 저장됐어요.<br>" +
      "<small style='color:#e74c3c'>⚠️ 선생님 시트 전송에 문제가 있어요. 알려주세요.</small><br><br>" +
      "지금은 잠깐 숨을 한 번 고르고 가요 🌿";
  } else {
    doneDesc.innerHTML =
      "지금 느끼는 불안을 컵에 담아줬어요.<br>" +
      "선생님과 함께 쪽지를 꺼내볼 거예요.<br><br>" +
      "지금은 잠깐 숨을 한 번 고르고 가요 🌿";
  }
}

function animateFly() {
  return new Promise(resolve => {
    const btn = document.getElementById("btnSubmit");
    const br  = btn.getBoundingClientRect();

    const el = document.createElement("div");
    el.className = "fly-note";
    el.textContent = "📝 …";
    el.style.left = (br.left + br.width / 2 - 82) + "px";
    el.style.top  = (br.top - 20) + "px";
    document.body.appendChild(el);

    setTimeout(() => { el.remove(); resolve(); }, 1050);
  });
}

function renderCup() {
  const stack = document.getElementById("notesStack");
  const label = document.getElementById("noteCountLabel");
  stack.innerHTML = "";

  if (noteCount === 0) {
    label.textContent = "아직 쪽지가 없어요";
    return;
  }

  label.textContent = `쪽지 ${noteCount}장이 들어있어요`;
  const slots = [
    { top: 12, left: 6, rot: -9 },
    { top: 24, left: 42, rot: 7 },
    { top: 38, left: 20, rot: -4 },
    { top: 56, left: 50, rot: 8 },
    { top: 70, left: 10, rot: -10 },
    { top: 86, left: 38, rot: 6 },
    { top: 102, left: 16, rot: -5 },
    { top: 118, left: 46, rot: 9 },
    { top: 132, left: 24, rot: -3 },
    { top: 144, left: 8, rot: 5 }
  ];
  const show = Math.min(noteCount, slots.length);
  for (let i = 0; i < show; i++) {
    const n = document.createElement("div");
    n.className = "mini-note";
    n.style.top = slots[i].top + "px";
    n.style.left = slots[i].left + "px";
    n.style.transform = `rotate(${slots[i].rot}deg)`;
    stack.appendChild(n);
  }
}

function writeAgain() {
  document.getElementById("mainCard").style.display = "block";
  document.getElementById("nicknameCard").style.display = "block";
  document.getElementById("doneCard").style.display = "none";
  document.getElementById("fEmotion").value = "";
  document.getElementById("fThought").value = "";
  document.getElementById("fSituation").value = "";
  updateNicknameUI(getNickname());
  const btn = document.getElementById("btnSubmit");
  btn.disabled = false;
  btn.textContent = "📝 쪽지 접어서 종이컵에 넣기";
  setMsg("", "");
  document.querySelector(".done-desc").innerHTML =
    "지금 느끼는 불안을 컵에 담아줬어요.<br>" +
    "선생님과 함께 쪽지를 꺼내볼 거예요.<br><br>" +
    "지금은 잠깐 숨을 한 번 고르고 가요 🌿";
}

function setMsg(text, type) {
  const el = document.getElementById("statusMsg");
  el.textContent = text;
  el.className = "status-msg " + type;
}

async function postToSheet(payload) {
  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
}
</script>
</body>
</html>
