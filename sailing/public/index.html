<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sailing · Wee센터 상담기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Sailing</p>
        <p class="brand-sub">Wee센터 상담기록 자동화 · v1.0</p>
      </div>
    </div>
    <div class="top-meta">
      <label class="date-field">
        <span>조회일</span>
        <input type="date" id="dateInput" />
      </label>
      <button type="button" class="btn ghost" id="refreshBtn" title="다시 불러오기">새로고침</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel schedule-panel" aria-labelledby="scheduleTitle">
      <div class="panel-head">
        <h2 id="scheduleTitle">오늘 상담</h2>
        <p class="hint">노션 캘린더의 기존 예약만 표시합니다</p>
      </div>

      <div class="search-row">
        <input type="search" id="studentSearch" placeholder="학생·사례번호 검색" autocomplete="off" />
        <button type="button" class="btn ghost" id="searchBtn">검색</button>
      </div>

      <div id="statusBar" class="status" role="status"></div>
      <ul id="scheduleList" class="schedule-list"></ul>
      <ul id="searchResults" class="schedule-list search-results" hidden></ul>
    </section>

    <section class="panel form-panel" aria-labelledby="formTitle">
      <div class="panel-head">
        <h2 id="formTitle">상담 기록</h2>
        <p class="hint" id="selectedLabel">학생을 선택하세요</p>
      </div>

      <div id="contextChips" class="chips" hidden></div>

      <div class="field-grid">
        <label class="field">
          <span>회기</span>
          <input type="text" id="sessionLabel" placeholder="예: 1회기 / 단회 / 자문" />
        </label>
        <label class="field">
          <span>대상</span>
          <select id="target">
            <option value="학생">학생</option>
            <option value="보호자">보호자</option>
            <option value="교사">교사</option>
          </select>
        </label>
        <label class="field">
          <span>성별</span>
          <input type="text" id="gender" placeholder="남 / 여" />
        </label>
        <label class="field">
          <span>학교명</span>
          <input type="text" id="school" placeholder="선택 입력" />
        </label>
        <label class="field">
          <span>학년/반</span>
          <input type="text" id="gradeClass" placeholder="예: 2학년 3반" />
        </label>
        <label class="field">
          <span>장소</span>
          <input type="text" id="place" placeholder="노션 장소 자동 반영" />
        </label>
      </div>

      <label class="field memo-field">
        <span class="memo-label-row">
          <span>키워드 메모</span>
          <button type="button" class="btn tiny" id="voiceBtn" title="음성 입력">🎤 음성</button>
        </span>
        <textarea id="keywords" rows="8" placeholder="한 줄에 키워드씩 입력&#10;&#10;예)&#10;친구와 다툼&#10;욕 인정&#10;감정온도계 실시&#10;다음시간 감정조절"></textarea>
      </label>

      <label class="field">
        <span>추가 정보 <em>(선택)</em></span>
        <textarea id="extraInfo" rows="2" placeholder="차회일시, 과제 등 있을 때만"></textarea>
      </label>

      <div class="actions">
        <button type="button" class="btn secondary" id="previewBtn" disabled>미리보기</button>
        <button type="button" class="btn primary" id="saveBtn" disabled>저장</button>
      </div>
    </section>

    <section class="panel preview-panel" aria-labelledby="previewTitle">
      <div class="panel-head">
        <h2 id="previewTitle">미리보기</h2>
        <p class="hint">저장 전 수정할 수 있습니다 · 기존 예약 페이지만 업데이트</p>
      </div>

      <div class="preview-tabs" role="tablist">
        <button type="button" class="tab active" data-tab="journal" role="tab" aria-selected="true">상담일지</button>
        <button type="button" class="tab" data-tab="memo" role="tab" aria-selected="false">상담자 메모</button>
      </div>

      <textarea id="journalPreview" class="preview-text" rows="18" placeholder="미리보기 또는 저장 시 AI가 작성합니다"></textarea>
      <textarea id="memoPreview" class="preview-text" rows="18" hidden placeholder="미리보기 또는 저장 시 AI가 작성합니다"></textarea>

      <p id="saveResult" class="save-result" hidden></p>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <p id="loadingText">처리 중…</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
