<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫙 불안 종이컵</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eef1ff;
  --accent: #6c7ef0;
  --accent2: #a78bfa;
  --paper: #fffbe6;
  --text: #2d3560;
  --muted: #8b96c8;
  --cup-body: #c9d6ff;
  --cup-rim: #a0b4f8;
  --shadow: rgba(108,126,240,0.13);
  --card: #fff;
}
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 16px 80px;
  color: var(--text);
}

.app-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.app-sub {
  font-size: 0.87rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.7;
  margin-bottom: 30px;
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 28px 22px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 6px 30px var(--shadow);
  margin-bottom: 18px;
}
.section-label {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
input[type="text"], textarea {
  width: 100%;
  border: 1.5px solid #dde3ff;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.93rem;
  font-family: inherit;
  color: var(--text);
  background: #f7f8ff;
  outline: none;
  resize: none;
  transition: border 0.2s, background 0.2s;
}
input[type="text"]:focus, textarea:focus {
  border-color: var(--accent);
  background: #fff;
}
.field-block { margin-bottom: 16px; }
.field-block label {
  display: block;
  font-size: 0.86rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}
.field-hint {
  font-size: 0.76rem;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.5;
}

.cup-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 4px;
  position: relative;
}
.cup-wrap {
  position: relative;
  width: 150px;
  height: 170px;
}
.cup-note-count {
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 10px;
  text-align: center;
}
.notes-in-cup {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
}
.mini-note {
  width: 42px;
  height: 30px;
  background: var(--paper);
  border: 1.5px solid #e8d06a;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: #a08000;
  margin-bottom: -12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}
.mini-note:nth-child(1) { transform: rotate(-6deg); }
.mini-note:nth-child(2) { transform: rotate(4deg); }
.mini-note:nth-child(3) { transform: rotate(-2deg); }
.mini-note:nth-child(4) { transform: rotate(7deg); }
.mini-note:nth-child(5) { transform: rotate(-4deg); }

@keyframes foldAndDrop {
  0%   { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
  30%  { transform: scale(0.8) rotate(-10deg) translateY(-20px); opacity: 0.95; }
  60%  { transform: scale(0.45) rotate(6deg) translateY(60px); opacity: 0.7; }
  85%  { transform: scale(0.2) rotate(-3deg) translateY(130px); opacity: 0.4; }
  100% { transform: scale(0.05) rotate(0deg) translateY(170px); opacity: 0; }
}
.fly-note {
  position: fixed;
  z-index: 9999;
  background: var(--paper);
  border: 2px solid #e8d06a;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.8rem;
  color: #7a6000;
  width: 130px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  pointer-events: none;
  animation: foldAndDrop 1.0s cubic-bezier(0.4,0,0.2,1) forwards;
}

.btn-main {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.01em;
  box-shadow: 0 5px 18px rgba(108,126,240,0.28);
  transition: background 0.2s, transform 0.1s;
}
.btn-main:hover { background: #5568e0; }
.btn-main:active { transform: scale(0.98); }
.btn-main:disabled { background: #c5cbe9; cursor: not-allowed; box-shadow: none; }

.btn-outline {
  padding: 12px 26px;
  border: 2px solid var(--accent);
  border-radius: 12px;
  background: transparent;
  color: var(--accent);
  font-size: 0.93rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 16px;
}
.btn-outline:hover { background: var(--accent); color: #fff; }

.status-msg {
  font-size: 0.86rem;
  text-align: center;
  margin-top: 11px;
  min-height: 20px;
  color: var(--muted);
}
.status-msg.err { color: #e74c3c; }
.status-msg.ok  { color: #27ae60; }

.done-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.done-screen.on { display: flex; }
.done-icon { font-size: 3.2rem; margin-bottom: 14px; animation: bounce 0.6s ease; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  40%      { transform: translateY(-12px); }
}
.done-title { font-size: 1.18rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
.done-desc  { font-size: 0.88rem; color: var(--muted); line-height: 1.8; }

.divider { border: none; border-top: 1.5px solid #eef0ff; margin: 18px 0; }
</style>
</head>
<body>

<div class="app-title">🫙 불안 종이컵</div>
<p class="app-sub">
  불안한 마음을 쪽지에 적어 컵에 넣어보세요.<br>
  한 번 넣은 쪽지는 꺼낼 수 없어요. 그래도 괜찮아요.
</p>

<div class="card" id="nicknameCard">
  <div class="section-label">나의 별칭</div>
  <input type="text" id="nickname" placeholder="예) 파란구름, 햇살이, 초록별…" maxlength="20">
  <div class="field-hint">별칭은 상담 선생님과 쪽지를 함께 볼 때 사용돼요. 이름 대신 마음에 드는 별칭을 써주세요.</div>
</div>

<div class="card" id="mainCard">
  <div class="cup-area">
    <div class="cup-wrap" id="cupWrap">
      <svg viewBox="0 0 150 170" width="150" height="170" xmlns="http://www.w3.org/2000/svg">
        <path d="M22,34 L12,158 Q12,163 22,163 L128,163 Q138,163 138,158 L128,34 Z"
              fill="#d4e0ff" stroke="#a0b4f8" stroke-width="2"/>
        <rect x="20" y="26" width="110" height="16" rx="8"
              fill="#b8ccff" stroke="#8aa6f5" stroke-width="1.5"/>
        <line x1="45" y1="34" x2="39" y2="160" stroke="#a0b4f8" stroke-width="1" opacity="0.4"/>
        <line x1="75" y1="32" x2="75" y2="160" stroke="#a0b4f8" stroke-width="1" opacity="0.4"/>
        <line x1="105" y1="34" x2="111" y2="160" stroke="#a0b4f8" stroke-width="1" opacity="0.4"/>
        <text x="75" y="110" text-anchor="middle"
              font-size="10.5" fill="#8aa6f5" opacity="0.55"
              font-family="sans-serif">불안 종이컵</text>
      </svg>
      <div class="notes-in-cup" id="notesStack"></div>
    </div>
    <div class="cup-note-count" id="noteCountLabel">아직 쪽지가 없어요</div>
  </div>

  <hr class="divider">

  <div class="field-block">
    <label>💜 지금 어떤 감정이 드나요?</label>
    <textarea id="fEmotion" rows="2"
      placeholder="예) 무서워, 조마조마해, 답답하고 울고 싶어…"></textarea>
    <div class="field-hint">불안 외에 함께 느껴지는 감정도 써도 좋아요.</div>
  </div>

  <div class="field-block">
    <label>💭 머릿속에 어떤 생각이 맴도나요?</label>
    <textarea id="fThought" rows="2"
      placeholder="예) '또 실수할 것 같아', '나만 이상한가봐', '어떡하지…'"></textarea>
  </div>

  <div class="field-block">
    <label>📍 어떤 상황이었나요?</label>
    <textarea id="fSituation" rows="2"
      placeholder="예) 발표가 있기 전날 밤, 친구랑 다툰 직후…"></textarea>
  </div>

  <button class="btn-main" id="btnSubmit" onclick="handleSubmit()">
    📝 쪽지 접어서 종이컵에 넣기
  </button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="card" id="doneCard" style="display:none;">
  <div class="done-screen on">
    <div class="done-icon">🫙✨</div>
    <div class="done-title">쪽지가 컵 속에 들어갔어요</div>
    <div class="done-desc">
      지금 느끼는 불안을 컵에 담아줬어요.<br>
      선생님과 함께 쪽지를 꺼내볼 거예요.<br><br>
      지금은 잠깐 숨을 한 번 고르고 가요 🌿
    </div>
    <button class="btn-outline" onclick="writeAgain()">+ 쪽지 하나 더 넣기</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const SCRIPT_URL = (typeof ANXIETY_CUP_CONFIG !== "undefined" && ANXIETY_CUP_CONFIG.GOOGLE_SHEETS_URL) || "";
const NICKNAME_KEY = "anxietyCupNickname";
const COUNT_KEY = "anxietyCupCount";

let noteCount = parseInt(localStorage.getItem(COUNT_KEY) || "0", 10);

(function init() {
  const saved = localStorage.getItem(NICKNAME_KEY);
  if (saved) document.getElementById("nickname").value = saved;
  renderCup();
})();

async function handleSubmit() {
  const nickname  = document.getElementById("nickname").value.trim();
  const emotion   = document.getElementById("fEmotion").value.trim();
  const thought   = document.getElementById("fThought").value.trim();
  const situation = document.getElementById("fSituation").value.trim();

  if (!nickname) { setMsg("별칭을 먼저 입력해 주세요 🙂", "err"); return; }
  if (!emotion && !thought && !situation) {
    setMsg("감정, 생각, 상황 중 하나 이상 적어주세요.", "err"); return;
  }

  localStorage.setItem(NICKNAME_KEY, nickname);

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  btn.textContent = "쪽지 접는 중…";
  setMsg("", "");

  await animateFly();

  const payload = {
    recordType: "note",
    timestamp: new Date().toLocaleString("ko-KR"),
    nickname, emotion, thought, situation
  };

  let syncOk = true;
  if (SCRIPT_URL) {
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    } catch (e) {
      console.warn("전송 오류:", e);
      syncOk = false;
    }
  }

  noteCount++;
  localStorage.setItem(COUNT_KEY, String(noteCount));
  renderCup();

  document.getElementById("mainCard").style.display = "none";
  document.getElementById("nicknameCard").style.display = "none";
  document.getElementById("doneCard").style.display = "block";

  if (SCRIPT_URL && !syncOk) {
    setMsg("⚠️ 저장 중 오류가 생겼어요. 선생님께 알려주세요.", "err");
  }
}

function animateFly() {
  return new Promise(resolve => {
    const btn = document.getElementById("btnSubmit");
    const br  = btn.getBoundingClientRect();

    const el = document.createElement("div");
    el.className = "fly-note";
    el.textContent = "📝 …";
    el.style.left = (br.left + br.width / 2 - 65) + "px";
    el.style.top  = (br.top - 20) + "px";
    document.body.appendChild(el);

    setTimeout(() => { el.remove(); resolve(); }, 1050);
  });
}

function renderCup() {
  const stack = document.getElementById("notesStack");
  const label = document.getElementById("noteCountLabel");
  stack.innerHTML = "";

  if (noteCount === 0) {
    label.textContent = "아직 쪽지가 없어요";
    return;
  }

  label.textContent = `쪽지 ${noteCount}장이 들어있어요`;
  const show = Math.min(noteCount, 5);
  for (let i = 0; i < show; i++) {
    const n = document.createElement("div");
    n.className = "mini-note";
    n.textContent = "✉";
    stack.appendChild(n);
  }
}

function writeAgain() {
  document.getElementById("mainCard").style.display = "block";
  document.getElementById("nicknameCard").style.display = "block";
  document.getElementById("doneCard").style.display = "none";
  document.getElementById("fEmotion").value = "";
  document.getElementById("fThought").value = "";
  document.getElementById("fSituation").value = "";
  const btn = document.getElementById("btnSubmit");
  btn.disabled = false;
  btn.textContent = "📝 쪽지 접어서 종이컵에 넣기";
  setMsg("", "");
}

function setMsg(text, type) {
  const el = document.getElementById("statusMsg");
  el.textContent = text;
  el.className = "status-msg " + type;
}
</script>
</body>
</html>
