<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 홈</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(145deg, #f3e5f5 0%, #e8f5e9 40%, #e3f2fd 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
      color: #5d5d6d;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      color: #6a5acd;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    header p {
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      color: #9e9eb0;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 640px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 36px 24px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    .project-card:active {
      transform: translateY(-1px);
    }

    .project-card .icon {
      font-size: 2.8rem;
      line-height: 1;
    }

    .project-card .title {
      font-size: clamp(1.15rem, 4vw, 1.35rem);
      font-weight: 700;
      color: #5d5d6d;
    }

    .project-card .desc {
      font-size: 0.9rem;
      color: #b0a8c0;
      text-align: center;
      line-height: 1.5;
    }

    .project-card.card {
      border-color: #f8bbd0;
    }

    .project-card.card:hover {
      border-color: #f48fb1;
    }

    .project-card.timer {
      border-color: #c8e6c9;
    }

    .project-card.timer:hover {
      border-color: #81c784;
    }

    .project-card.cup {
      border-color: #c7d2fe;
    }

    .project-card.cup:hover {
      border-color: #6c7ef0;
    }

    .project-card.deploy {
      border-color: #b3e5fc;
      cursor: default;
    }
    .project-card.deploy:hover {
      transform: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    .card-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }
    .card-btn {
      flex: 1;
      display: block;
      text-align: center;
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.12s, opacity 0.15s;
    }
    .card-btn:active { transform: scale(0.96); }
    .card-btn.open {
      background: linear-gradient(135deg, #ce93d8, #b39ddb);
      color: #fff;
    }
    .card-btn.download {
      background: rgba(255, 255, 255, 0.95);
      color: #7e57c2;
      border: 2px solid #d1c4e9;
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: 0.85rem;
      color: #c0b8d0;
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ 프로젝트 모음</h1>
    <p>원하는 프로젝트를 선택하세요</p>
  </header>

  <nav class="projects">
    <a class="project-card card" href="consultation-card/">
      <span class="icon">🌈</span>
      <span class="title">오늘의 마음날씨</span>
      <span class="desc">상담실 체크인 · Google 시트 연동 · 선생님용</span>
    </a>

    <a class="project-card cup" href="anxiety-cup/">
      <span class="icon">🫙</span>
      <span class="title">불안 종이컵</span>
      <span class="desc">학생 쪽지 적기 · 선생님 파도타기 · Google 시트 연동</span>
    </a>

    <div class="project-card deploy">
      <span class="icon">📱</span>
      <span class="title">마음날씨 배포용</span>
      <span class="desc">시트 연동 없음 · HTML 1개 · 학생·다른 센터 배포용</span>
      <div class="card-actions">
        <a class="card-btn open" href="consultation-card/%EB%A7%88%EC%9D%8C%EB%82%A0%EC%94%A8%EA%B8%B0%EB%A1%9D_%EB%B0%B0%ED%8F%AC%EC%9A%A9.html">열기</a>
        <a class="card-btn download" href="consultation-card/%EB%A7%88%EC%9D%8C%EB%82%A0%EC%94%A8%EA%B8%B0%EB%A1%9D_%EB%B0%B0%ED%8F%AC%EC%9A%A9.html" download="마음날씨기록_배포용.html">⬇️ 다운로드</a>
      </div>
    </div>

    <a class="project-card timer" href="https://script.google.com/macros/s/AKfycbyy2F2mNCKxWDsZb_ePLzbt2Ol0xKTxPQ0YgNWjbaJuN9FtIMRxbwC51Ktapy0jotJ69Q/exec">
      <span class="icon">🕐</span>
      <span class="title">상담 타이머</span>
      <span class="desc">노션 일정 연동 · 초·중·고·학부모 · 상담종료 시 시트 기록</span>
    </a>
  </nav>

  <footer>123-vibe</footer>
</body>
</html>
